<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>岐黃學堂 — 中醫學習</title>
<!-- PWA: theme & status bar -->
<meta name="theme-color" content="#d97748">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="岐黃學堂">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="岐黃學堂">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.0/firebase-app-compat.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.0/firebase-firestore-compat.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.0/firebase-auth-compat.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>
:root {
  --bg-0:#f8ead8;--bg-1:#f0d9c0;--bg-card:#fffbf7;--bg-card-hover:#fff3ea;
  --text-0:#2c1810;--text-1:#6b4a3a;--text-2:#9a7a68;
  --accent:#d97748;--accent-light:#fef0e6;--accent-hover:#c4643a;
  --gold:#c49a3d;--gold-light:#fdf6e3;
  --danger:#c94040;--danger-light:#fde8e8;
  --border:#dcc0a6;--border-light:#e8d0bc;
  --shadow:0 2px 14px rgba(80,40,10,0.09);
  --shadow-lg:0 8px 32px rgba(80,40,10,0.14);
  --radius:14px;--radius-sm:10px;--radius-lg:20px;
  --nav-h:62px;--header-h:54px;
  --font:'Nunito','Noto Sans TC',sans-serif;
  --transition:0.25s cubic-bezier(0.4,0,0.2,1);
}
html.dark {
  --bg-0:#141010;--bg-1:#1e1714;--bg-card:#2a201a;--bg-card-hover:#342820;
  --text-0:#f2dece;--text-1:#bfa08a;--text-2:#7d6555;
  --accent:#e09060;--accent-light:#2e2118;--accent-hover:#eda878;
  --gold:#d4a860;--gold-light:#2a2214;
  --danger:#e05050;--danger-light:#2e1818;
  --border:#3e3028;--border-light:#2c2218;
  --shadow:0 2px 14px rgba(0,0,0,0.35);
  --shadow-lg:0 8px 32px rgba(0,0,0,0.45);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg-0);color:var(--text-0);
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.6}
a{color:var(--accent);text-decoration:none}
input,select,textarea,button{font-family:inherit;font-size:16px}
button,.card,.pill,.sel-pill,.nav-btn,.fab,.img-upload-zone,.sr-item,.merid-banner,.fmt-btn,[data-action]{
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* === SETUP === */
#setup-screen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#d97748 0%,#c4643a 50%,#a85230 100%);padding:20px;overflow-y:auto}
.setup-box{background:var(--bg-card);border-radius:var(--radius-lg);padding:36px 26px;
  max-width:440px;width:100%;box-shadow:var(--shadow-lg);text-align:center}
.setup-logo{font-weight:900;font-size:2.2rem;color:var(--accent);margin-bottom:4px;letter-spacing:3px}
.setup-sub{font-size:0.92rem;color:var(--text-2);margin-bottom:24px}
.setup-box label{display:block;text-align:left;font-size:0.85rem;color:var(--text-1);margin-bottom:4px;margin-top:12px;font-weight:600}
.setup-box textarea{width:100%;min-height:130px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 12px;background:var(--bg-0);color:var(--text-0);resize:vertical;font-size:13px;font-family:monospace}
.setup-box textarea:focus{border-color:var(--accent);outline:none}
.setup-hint{font-size:0.76rem;color:var(--text-2);text-align:left;margin-top:4px;line-height:1.5}
.setup-btns{display:flex;gap:10px;margin-top:20px}
.setup-btns button{flex:1;padding:12px;border:none;border-radius:var(--radius-sm);font-weight:700;font-size:1rem;cursor:pointer;transition:var(--transition)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--bg-1);color:var(--text-1);border:1.5px solid var(--border) !important}
.btn-secondary:hover{background:var(--bg-card-hover)}
.setup-err{color:var(--danger);font-size:0.85rem;margin-top:8px;min-height:1.2em}

/* === SHELL === */
#app-main{display:none;height:100%;flex-direction:column;overflow:hidden}
#app-main.active{display:flex}
.app-header{height:var(--header-h);display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;background:var(--bg-card);border-bottom:1px solid var(--border-light);flex-shrink:0;z-index:100}
.app-header .logo{font-weight:900;font-size:1.2rem;color:var(--accent);letter-spacing:2px;cursor:pointer}
.header-actions{display:flex;gap:4px}
.header-actions button{width:36px;height:36px;border:none;background:transparent;color:var(--text-1);
  font-size:1.05rem;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:var(--transition)}
.header-actions button:hover,.header-actions button.active{background:var(--accent-light);color:var(--accent)}
.search-bar{display:none;padding:8px 14px;background:var(--bg-card);border-bottom:1px solid var(--border-light)}
.search-bar.open{display:block}
.search-bar{position:relative}
.search-bar input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:24px;
  background:var(--bg-0);color:var(--text-0);font-size:16px}
.search-bar input:focus{border-color:var(--accent);outline:none}
.search-results{position:absolute;left:14px;right:14px;top:100%;background:var(--bg-card);border:1.5px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow-lg);max-height:60vh;overflow-y:auto;z-index:300;display:none}
.search-results.open{display:block}
.sr-group-title{font-size:0.72rem;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:0.6px;
  padding:8px 14px 4px;display:flex;align-items:center;gap:5px;border-bottom:1px solid var(--border-light)}
.sr-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:var(--transition);border-bottom:1px solid var(--border-light)}
.sr-item:last-child{border-bottom:none}
.sr-item:hover,.sr-item:active{background:var(--accent-light)}
.sr-icon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:0.75rem;flex-shrink:0;background:var(--bg-1);color:var(--text-2)}
.sr-info{flex:1;min-width:0}
.sr-name{font-weight:700;font-size:0.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-name em{font-style:normal;color:var(--accent);font-weight:900}
.sr-sub{font-size:0.73rem;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-empty{padding:24px 14px;text-align:center;color:var(--text-2);font-size:0.86rem}
.sub-header{flex-shrink:0;background:var(--bg-card);border-bottom:1px solid var(--border-light)}
.pill-row{display:flex;gap:6px;padding:7px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.pill-row::-webkit-scrollbar{display:none}
.pill{padding:5px 13px;border-radius:18px;font-size:0.8rem;font-weight:600;white-space:nowrap;
  border:1.5px solid var(--border);color:var(--text-1);background:var(--bg-card);cursor:pointer;transition:var(--transition);flex-shrink:0}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.pill.gold{border-color:var(--gold);color:var(--gold)}
.pill.gold.active{background:var(--gold);color:#fff;border-color:var(--gold)}
.content-area{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(var(--nav-h) + 16px);-webkit-overflow-scrolling:touch}
.view{display:none;padding:14px;animation:fadeUp 0.3s ease}
.view.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Bottom nav - 6 tabs */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);display:flex;
  background:var(--bg-card);border-top:1px solid var(--border-light);z-index:200;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border:none;background:transparent;color:var(--text-2);cursor:pointer;font-size:0.62rem;font-weight:600;
  transition:var(--transition);position:relative;padding:0 2px}
.nav-btn i{font-size:1.05rem;transition:var(--transition)}
.nav-btn.active{color:var(--accent)}
.nav-btn.active i{transform:scale(1.12)}
.nav-btn .badge{position:absolute;top:5px;right:calc(50% - 16px);background:var(--danger);color:#fff;
  font-size:0.55rem;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-weight:700;padding:0 3px}

/* === CARDS === */
.card{background:var(--bg-card);border-radius:var(--radius);padding:13px 15px;margin-bottom:10px;
  border-left:4px solid var(--accent);box-shadow:var(--shadow);cursor:pointer;transition:var(--transition)}
.card:hover{background:var(--bg-card-hover);transform:translateX(2px)}
.card:active{transform:scale(0.98)}
.card-title{font-weight:900;font-size:1.15rem;margin-bottom:3px;display:flex;align-items:center;gap:7px;letter-spacing:0.2px}
.card-sub{font-size:0.85rem;color:var(--text-1);margin-bottom:4px;font-weight:700}
.card-preview{font-size:0.86rem;color:var(--text-1);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;gap:7px;margin-top:5px;font-size:0.73rem;color:var(--text-2);flex-wrap:wrap}
.card-meta span{display:flex;align-items:center;gap:3px}
.card-thumbs{display:flex;gap:4px;margin-top:7px}
.card-thumbs img{width:38px;height:38px;object-fit:cover;border-radius:8px;border:1px solid var(--border-light)}
.card-herb-xw{font-size:0.82rem;color:var(--accent);font-weight:600;margin-bottom:3px;display:flex;align-items:center}
.card-herb-formulas{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.badge-gold-sm{display:inline-block;font-size:0.7rem;padding:1px 7px;border-radius:10px;background:rgba(217,119,72,0.12);color:var(--accent);font-weight:600;white-space:nowrap}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-2)}
.empty-state i{font-size:2.8rem;margin-bottom:14px;opacity:0.35}
.empty-state p{font-size:0.92rem}
.fab{position:fixed;bottom:calc(var(--nav-h) + 18px);right:18px;width:52px;height:52px;border-radius:50%;
  background:var(--accent);color:#fff;border:none;font-size:1.4rem;
  box-shadow:0 4px 16px rgba(217,119,72,0.35);cursor:pointer;z-index:150;
  display:flex;align-items:center;justify-content:center;transition:var(--transition)}
.fab:hover{transform:scale(1.1);background:var(--accent-hover)}
.fab:active{transform:scale(0.95)}

/* === DETAIL === */
.detail-header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.detail-back{width:36px;height:36px;border:none;background:var(--bg-1);color:var(--text-1);border-radius:50%;
  cursor:pointer;font-size:0.95rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:var(--transition)}
.detail-back:hover{background:var(--accent-light);color:var(--accent)}
.detail-title{font-weight:900;font-size:1.55rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:0.3px}
.detail-actions{display:flex;gap:5px;flex-shrink:0}
.detail-actions button{width:34px;height:34px;border:none;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:0.9rem;transition:var(--transition)}
.btn-edit{background:var(--gold-light);color:var(--gold)}
.btn-edit:hover{background:var(--gold);color:#fff}
.btn-del{background:var(--danger-light);color:var(--danger)}
.btn-del:hover{background:var(--danger);color:#fff}
.detail-section{margin-bottom:18px}
.detail-label{font-size:0.82rem;color:var(--text-2);font-weight:800;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:5px}
.detail-value{font-size:0.96rem;line-height:1.75;white-space:pre-wrap}
.detail-value.empty{color:var(--text-2);font-style:italic;font-size:0.84rem}
.detail-badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.badge{padding:4px 10px;border-radius:14px;font-size:0.74rem;font-weight:700}
.badge-accent{background:var(--accent-light);color:var(--accent)}
.badge-gold{background:var(--gold-light);color:var(--gold)}
.badge-link{cursor:pointer;transition:var(--transition)}.badge-link:hover{filter:brightness(0.9);transform:scale(1.04)}
.img-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px;margin-top:7px}
.img-gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--radius-sm);cursor:pointer;border:1px solid var(--border-light);transition:var(--transition)}
.img-gallery img:hover{transform:scale(1.03);box-shadow:var(--shadow)}
.comp-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:5px}
.comp-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:18px;background:var(--accent-light);border:1px solid var(--border)}
.comp-chip .c-name{font-weight:700;font-size:0.84rem;color:var(--accent)}
.comp-chip .c-dose{font-size:0.76rem;color:var(--text-2)}
.comp-chip .c-prep{font-size:0.73rem;color:var(--text-2);font-style:italic}

/* === FORM === */
.form-title{font-weight:800;font-size:1.15rem;margin-bottom:18px;display:flex;align-items:center;gap:10px}
/* Bold toolbar */
.fmt-toolbar{display:flex;gap:4px;margin-bottom:4px}
.fmt-btn{width:30px;height:28px;border:1.5px solid var(--border);border-radius:6px;background:var(--bg-0);
  color:var(--text-1);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:0.82rem;font-weight:900;transition:var(--transition);flex-shrink:0}
.fmt-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.fmt-btn:active{transform:scale(0.92)}
.fmt-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:0.82rem;color:var(--text-1);font-weight:700;margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 13px;
  border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-0);
  color:var(--text-0);font-size:16px;transition:var(--transition)}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(217,119,72,0.1)}
.form-group textarea{min-height:75px;resize:vertical;line-height:1.6}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-submit{display:flex;gap:10px;margin-top:22px;padding-bottom:12px}
.form-submit button{flex:1;padding:14px 12px;border:none;border-radius:var(--radius-sm);font-weight:700;font-size:1rem;cursor:pointer;transition:var(--transition);min-height:48px}
.dupe-warn{color:var(--gold);font-size:0.79rem;margin-top:4px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;line-height:1.7}
.img-upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:22px;text-align:center;
  color:var(--text-2);cursor:pointer;transition:var(--transition);margin-top:7px;position:relative}
.img-upload-zone:hover,.img-upload-zone.dragover{border-color:var(--accent);background:var(--accent-light);color:var(--accent)}
.img-upload-zone i{font-size:1.6rem;margin-bottom:6px;pointer-events:none}
.img-upload-zone p{font-size:0.83rem;pointer-events:none}
.img-upload-zone input[type="file"]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.img-previews{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:7px;margin-top:8px}
.img-preview{position:relative;aspect-ratio:1;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-light)}
.img-preview img{width:100%;height:100%;object-fit:cover}
.img-preview .remove-img{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,0.6);color:#fff;border:none;cursor:pointer;font-size:0.68rem;
  display:flex;align-items:center;justify-content:center}
.img-preview .upload-progress{position:absolute;inset:0;background:rgba(0,0,0,0.5);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:0.8rem}

/* Tag / autocomplete inputs */
.tag-input-wrap{position:relative}
.tag-list{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.tag-item{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:14px;
  background:var(--accent-light);color:var(--accent);font-size:0.8rem;font-weight:700}
.tag-item button{background:none;border:none;color:var(--accent);cursor:pointer;font-size:0.75rem;padding:0 2px;opacity:0.7}
.tag-item button:hover{opacity:1}
.ac-dropdown{position:absolute;left:0;right:0;top:100%;z-index:50;background:var(--bg-card);
  border:1.5px solid var(--border);border-radius:var(--radius-sm);max-height:180px;overflow-y:auto;
  box-shadow:var(--shadow-lg);display:none}
.ac-dropdown.show{display:block}
.ac-item{padding:8px 12px;cursor:pointer;font-size:0.86rem;transition:background 0.15s}
.ac-item:hover{background:var(--accent-light)}
.ac-item .ac-sub{font-size:0.73rem;color:var(--text-2);margin-left:6px}
.herb-list-items{margin-bottom:7px}
.herb-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:10px 12px;background:var(--bg-0);border-radius:var(--radius-sm);margin-bottom:6px;position:relative}
.herb-row .h-top{display:flex;align-items:center;gap:8px;width:100%}
.herb-row .h-name{font-weight:700;font-size:0.9rem;min-width:50px;flex-shrink:0;color:var(--accent)}
.herb-row input{padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-card);font-size:16px;color:var(--text-0)}
.herb-row input:focus{border-color:var(--accent);outline:none}
.herb-row button.herb-rm{width:26px;height:26px;border:none;border-radius:50%;background:var(--danger-light);
  color:var(--danger);cursor:pointer;font-size:0.72rem;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.herb-prep{width:100%;padding-left:0}
.herb-prep input{width:100%;font-size:16px}
.herb-unit-custom{width:52px;min-width:44px;padding:7px 6px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-card);font-size:15px;color:var(--text-0);text-align:center}
.herb-unit-custom:focus{border-color:var(--accent);outline:none}
.sel-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.sel-pill{padding:6px 14px;border-radius:18px;font-size:0.84rem;font-weight:600;border:1.5px solid var(--border);
  color:var(--text-1);background:var(--bg-card);cursor:pointer;transition:var(--transition);user-select:none}
.sel-pill:hover{border-color:var(--accent);color:var(--accent)}
.sel-pill.chosen{background:var(--accent);color:#fff;border-color:var(--accent)}
/* Multi-input list */
.mi-items{margin-bottom:5px}
.mi-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.mi-ac-wrap{position:relative}
.mi-ac-dd{position:absolute;left:0;right:32px;top:100%;z-index:50;background:var(--bg-card);
  border:1.5px solid var(--border);border-radius:var(--radius-sm);max-height:160px;overflow-y:auto;
  box-shadow:var(--shadow-lg);display:none}
.mi-ac-dd.show{display:block}
.mi-ac-dd .ac-item{padding:7px 12px;cursor:pointer;font-size:0.84rem;transition:background 0.15s}
.mi-ac-dd .ac-item:hover{background:var(--accent-light)}
.mi-ac-dd .ac-item .ac-count{font-size:0.7rem;color:var(--text-2);margin-left:6px}
.mi-row input{flex:1;padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  background:var(--bg-0);color:var(--text-0);font-size:16px;transition:var(--transition)}
.mi-row input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(217,119,72,0.1)}
.mi-row button{width:26px;height:26px;border:none;border-radius:50%;background:var(--danger-light);
  color:var(--danger);cursor:pointer;font-size:0.72rem;flex-shrink:0;display:flex;align-items:center;justify-content:center}
/* Herb dosage with unit */
.herb-dose-wrap{display:flex;gap:5px;align-items:center;min-width:0;flex-shrink:0}
.herb-dose-wrap input{width:64px;min-width:54px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-card);font-size:16px;color:var(--text-0);text-align:center}
.herb-dose-wrap input:focus{border-color:var(--accent);outline:none}
.herb-dose-wrap select{padding:7px 6px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-card);color:var(--text-1);font-size:15px;min-width:52px}
.herb-dose-wrap select:focus{border-color:var(--accent);outline:none}
/* Unit toggle in detail */
.unit-toggle{display:inline-flex;gap:0;border:1.5px solid var(--border);border-radius:14px;overflow:hidden;margin-left:8px;vertical-align:middle}
.unit-toggle button{padding:3px 10px;border:none;background:var(--bg-card);color:var(--text-2);font-size:0.72rem;
  font-weight:700;cursor:pointer;transition:var(--transition)}
.unit-toggle button.active{background:var(--accent);color:#fff}

/* === HOME === */
.home-greeting{font-weight:900;font-size:1.7rem;margin-bottom:3px;line-height:1.3}
.home-sub{color:var(--text-2);margin-bottom:22px;font-size:0.88rem}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:22px}
.stat-card{background:var(--bg-card);border-radius:var(--radius);padding:14px;text-align:center;
  box-shadow:var(--shadow);border-top:3px solid var(--accent)}
.stat-card:nth-child(2){border-top-color:var(--gold)}
.stat-card:nth-child(3){border-top-color:#7c6fbc}
.stat-card:nth-child(4){border-top-color:#5ea0a0}
.stat-card:nth-child(5){border-top-color:var(--danger)}
.stat-num{font-weight:900;font-size:1.7rem;line-height:1}
.stat-label{font-size:0.76rem;color:var(--text-2);margin-top:3px}
.section-title{font-weight:800;font-size:1.02rem;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.quick-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:22px}
.quick-btn{display:flex;align-items:center;gap:9px;padding:13px;background:var(--bg-card);border-radius:var(--radius);
  border:1.5px solid var(--border);cursor:pointer;transition:var(--transition)}
.quick-btn:hover{border-color:var(--accent);background:var(--accent-light)}
.quick-btn i{font-size:1.1rem;color:var(--accent);width:18px;text-align:center}
.quick-btn span{font-size:0.83rem;font-weight:700}

/* === QUIZ === */
.quiz-setup{max-width:480px;margin:0 auto}
.quiz-card-wrap{max-width:480px;margin:0 auto;perspective:1000px}
.quiz-progress{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:0.84rem;color:var(--text-2)}
.quiz-progress-bar{flex:1;height:6px;background:var(--bg-1);border-radius:3px;overflow:hidden}
.quiz-progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width 0.4s ease}
.quiz-card{min-height:300px;border-radius:var(--radius-lg);position:relative;transform-style:preserve-3d;transition:transform 0.5s ease;cursor:pointer}
.quiz-card.flipped{transform:rotateY(180deg)}
.quiz-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius-lg);padding:26px 22px;
  display:flex;flex-direction:column;box-shadow:var(--shadow-lg);overflow-y:auto}
.quiz-front{background:linear-gradient(145deg,var(--bg-card) 0%,var(--accent-light) 100%);align-items:center;justify-content:center;text-align:center}
.quiz-front .q-name{font-weight:900;font-size:1.7rem;margin-bottom:7px}
.quiz-front .q-hint{color:var(--text-2);font-size:0.84rem}
.quiz-front .q-tap{position:absolute;bottom:18px;color:var(--text-2);font-size:0.78rem;opacity:0.5}
.quiz-back{background:var(--bg-card);transform:rotateY(180deg)}
.quiz-back .q-field{margin-bottom:9px}
.quiz-back .q-field-label{font-size:0.73rem;color:var(--text-2);font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
.quiz-back .q-field-value{font-size:0.88rem;line-height:1.6;white-space:pre-wrap}
.quiz-rating{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}
.quiz-rating button{padding:11px 6px;border:none;border-radius:var(--radius-sm);font-weight:700;font-size:0.78rem;
  cursor:pointer;transition:var(--transition);display:flex;flex-direction:column;align-items:center;gap:3px}
.quiz-rating button:hover{transform:scale(1.05)}
.rate-again{background:#fee2e2;color:#dc2626}
.rate-hard{background:#fef3c7;color:#d97706}
.rate-good{background:#d1fae5;color:#059669}
.rate-easy{background:#dbeafe;color:#2563eb}
.quiz-results{max-width:480px;margin:0 auto;text-align:center}
.quiz-results .result-score{font-weight:900;font-size:2.8rem;color:var(--accent);margin:18px 0}

/* Quiz type badges */
.q-type-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:14px;
  font-size:0.76rem;font-weight:700;margin-bottom:12px}
.q-type-badge.flip{background:var(--accent-light);color:var(--accent)}
.q-type-badge.mcq{background:#dbeafe;color:#2563eb}
html.dark .q-type-badge.mcq{background:#1e293b;color:#60a5fa}
.q-type-badge.fill{background:#fce7f3;color:#db2777}
html.dark .q-type-badge.fill{background:#2a1929;color:#f472b6}

/* MCQ card */
.mcq-card{background:var(--bg-card);border-radius:var(--radius-lg);padding:24px 20px;box-shadow:var(--shadow-lg)}
.mcq-question{font-weight:900;font-size:1.45rem;margin-bottom:6px;text-align:center;line-height:1.4}
.mcq-hint{font-size:0.82rem;color:var(--text-2);text-align:center;margin-bottom:14px}
.mcq-field-label{font-size:0.8rem;color:var(--text-1);font-weight:700;margin-bottom:8px}
.mcq-options{display:flex;flex-direction:column;gap:8px}
.mcq-opt{width:100%;padding:13px 16px;border:2px solid var(--border);border-radius:var(--radius-sm);
  background:var(--bg-0);color:var(--text-0);font-size:0.92rem;font-weight:600;text-align:left;
  cursor:pointer;transition:var(--transition);line-height:1.5}
.mcq-opt:hover{border-color:var(--accent);background:var(--accent-light)}
.mcq-opt.correct{border-color:#059669;background:#d1fae5;color:#065f46;cursor:default}
html.dark .mcq-opt.correct{background:#0f2922;color:#6ee7b7;border-color:#10b981}
.mcq-opt.wrong{border-color:#dc2626;background:#fee2e2;color:#991b1b;cursor:default}
html.dark .mcq-opt.wrong{background:#2e1414;color:#fca5a5;border-color:#ef4444}
.mcq-opt.correct::before{content:'\f058';font-family:'Font Awesome 6 Free';font-weight:900;margin-right:8px;font-size:1rem}
.mcq-opt.wrong::before{content:'\f057';font-family:'Font Awesome 6 Free';font-weight:900;margin-right:8px;font-size:1rem}

/* Fill-in-blank */
.fill-prompt{font-size:0.92rem;color:var(--text-1);margin-bottom:12px;text-align:center;font-weight:600}
.fill-clue{background:var(--bg-0);border-radius:var(--radius-sm);padding:14px;margin-bottom:14px;text-align:center;border:1px solid var(--border-light)}
.fill-clue-label{display:block;font-size:0.72rem;color:var(--text-2);font-weight:700;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:5px}
.fill-clue-value{display:block;font-size:1.05rem;color:var(--text-0);line-height:1.6;font-weight:600}
.fill-input-wrap{display:flex;gap:8px;align-items:stretch}
.fill-input{flex:1;padding:12px 14px;border:2px solid var(--border);border-radius:var(--radius-sm);
  background:var(--bg-0);color:var(--text-0);font-size:16px;transition:var(--transition)}
.fill-input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(217,119,72,0.12)}
.fill-result{padding:14px;border-radius:var(--radius-sm);text-align:center;font-weight:700;font-size:0.92rem;margin-top:10px}
.fill-result .fill-result-icon{display:flex;align-items:center;justify-content:center;gap:7px}
.fill-result.correct{background:#d1fae5;color:#065f46}
html.dark .fill-result.correct{background:#0f2922;color:#6ee7b7}
.fill-result.wrong{background:#fee2e2;color:#991b1b}
html.dark .fill-result.wrong{background:#2e1414;color:#fca5a5}

/* === MERIDIAN MAP === */
.merid-banner{background:linear-gradient(135deg,var(--accent-light) 0%,var(--gold-light) 100%);
  border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;cursor:pointer;
  display:flex;align-items:center;gap:12px;border:1.5px solid var(--border-light);transition:var(--transition)}
.merid-banner:hover{border-color:var(--accent);transform:translateX(2px)}
.merid-banner-icon{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.merid-banner-text{flex:1;min-width:0}
.merid-banner-text .title{font-weight:800;font-size:0.92rem;margin-bottom:2px}
.merid-banner-text .sub{font-size:0.78rem;color:var(--text-2)}
.merid-banner-arrow{color:var(--text-2);font-size:0.85rem}
.merid-map-wrap{display:flex;justify-content:center;padding:0 6px;margin-bottom:18px}
.merid-map-wrap svg{width:100%;max-width:360px;height:auto}
.merid-dot-active{filter:drop-shadow(0 0 4px currentColor)}
@keyframes meridPulse{0%,100%{opacity:1}50%{opacity:0.5}}
.merid-dot-active{animation:meridPulse 2s ease-in-out infinite}
.merid-legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;justify-content:center}
.merid-legend-item{display:flex;align-items:center;gap:4px;font-size:0.7rem;color:var(--text-1);
  padding:3px 8px;border-radius:10px;background:var(--bg-0);border:1px solid var(--border-light);cursor:pointer;transition:var(--transition)}
.merid-legend-item:hover{border-color:var(--accent)}
.merid-legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.merid-stats{background:var(--bg-card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.merid-stats-title{font-weight:800;font-size:0.92rem;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.merid-progress-total{text-align:center;margin-bottom:16px;padding:14px;background:linear-gradient(135deg,var(--accent-light),var(--gold-light));border-radius:var(--radius-sm)}
.merid-progress-total .big{font-weight:900;font-size:2rem;color:var(--accent);display:block;line-height:1.2}
.merid-progress-total .label{font-size:0.82rem;color:var(--text-2)}
.merid-stat-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border-light)}
.merid-stat-row:last-child{border-bottom:none}
.merid-stat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.merid-stat-name{font-size:0.78rem;font-weight:600;min-width:90px;color:var(--text-0)}
.merid-stat-bar{flex:1;height:6px;background:var(--bg-1);border-radius:3px;overflow:hidden}
.merid-stat-bar span{display:block;height:100%;border-radius:3px;transition:width 0.5s ease}
.merid-stat-num{font-size:0.72rem;color:var(--text-2);font-weight:700;min-width:32px;text-align:right}
.merid-tooltip{position:absolute;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;
  padding:6px 10px;font-size:0.76rem;font-weight:600;box-shadow:var(--shadow);pointer-events:none;
  z-index:10;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px}

/* === SETTINGS === */
.settings-section{background:var(--bg-card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.settings-section h3{font-size:0.92rem;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.settings-item{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border-light)}
.settings-item:last-child{border-bottom:none}
.settings-item span{font-size:0.86rem}
.settings-item button{padding:5px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  background:var(--bg-0);color:var(--text-1);font-size:0.8rem;cursor:pointer;transition:var(--transition)}
.settings-item button:hover{border-color:var(--accent);color:var(--accent)}
.lm-item{display:flex;align-items:center;gap:7px;padding:7px;background:var(--bg-0);border-radius:var(--radius-sm);margin-bottom:5px}
.lm-item span{flex:1;font-size:0.86rem}
.lm-item button{width:26px;height:26px;border:none;border-radius:50%;background:var(--bg-card);cursor:pointer;
  font-size:0.72rem;color:var(--text-1);display:flex;align-items:center;justify-content:center;transition:var(--transition)}
.lm-item button:hover{color:var(--accent);background:var(--accent-light)}

/* === LIGHTBOX === */
.lightbox{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;flex-direction:column}
.lightbox.open{display:flex}
.lightbox img{max-width:90vw;max-height:80vh;object-fit:contain;border-radius:var(--radius-sm)}
.lightbox-close{position:absolute;top:14px;right:14px;width:38px;height:38px;border:none;
  background:rgba(255,255,255,0.15);color:#fff;font-size:1.1rem;border-radius:50%;cursor:pointer}
.lightbox-nav{position:absolute;top:50%;width:38px;height:38px;border:none;background:rgba(255,255,255,0.15);
  color:#fff;font-size:1rem;border-radius:50%;cursor:pointer;transform:translateY(-50%)}
.lightbox-prev{left:10px}
.lightbox-next{right:10px}
.lightbox-counter{color:rgba(255,255,255,0.6);font-size:0.83rem;margin-top:10px}

/* === MODAL === */
.modal-overlay{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,0.45);display:flex;
  align-items:center;justify-content:center;padding:20px;animation:fadeIn 0.2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{background:var(--bg-card);border-radius:var(--radius-lg);padding:22px;max-width:400px;
  width:100%;box-shadow:var(--shadow-lg);animation:modalIn 0.25s ease}
@keyframes modalIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}
.modal-title{font-weight:800;font-size:1.05rem;margin-bottom:10px}
.modal-body{font-size:0.88rem;color:var(--text-1);margin-bottom:18px;line-height:1.6;white-space:pre-wrap}
.modal-body input,.modal-body textarea{width:100%;padding:10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  background:var(--bg-0);color:var(--text-0);font-size:16px;margin-top:7px}
.modal-body input:focus,.modal-body textarea:focus{border-color:var(--accent);outline:none}
.modal-btns{display:flex;gap:7px;justify-content:flex-end}
.modal-btns button{padding:9px 18px;border:none;border-radius:var(--radius-sm);font-weight:700;font-size:0.88rem;cursor:pointer;transition:var(--transition)}

/* === TOAST === */
.toast-wrap{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:6000;display:flex;flex-direction:column;gap:7px;pointer-events:none;max-width:90vw}
.toast{padding:11px 18px;border-radius:var(--radius-sm);font-size:0.86rem;font-weight:600;box-shadow:var(--shadow-lg);animation:toastIn 0.3s ease;pointer-events:auto}
.toast.success{background:#059669;color:#fff}
.toast.error{background:var(--danger);color:#fff}
.toast.info{background:var(--accent);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:480px){
  .home-greeting{font-size:1.3rem}
  .quick-actions{grid-template-columns:1fr}
  .form-row{grid-template-columns:1fr}
  .quiz-card{min-height:260px}
  .quiz-front .q-name{font-size:1.3rem}
  .detail-title{font-size:1.15rem}
  .stats-grid{gap:7px}
}
</style>
</head>
<body>
<div id="setup-screen">
  <div class="setup-box">
    <div class="setup-logo">🌿 岐黃學堂</div>
    <div class="setup-sub">中醫學習助手</div>
    <div style="margin-top:24px;color:var(--text-1);font-size:0.9rem"><i class="fa-solid fa-spinner fa-spin" style="margin-right:6px"></i>連接中…</div>
  </div>
</div>

<div id="app-main">
  <header class="app-header">
    <div class="logo" id="logo-home">🌿 岐黃學堂</div>
    <div class="header-actions">
      <button id="btn-search" title="搜尋"><i class="fa-solid fa-magnifying-glass"></i></button>
      <button id="btn-settings" title="設定"><i class="fa-solid fa-gear"></i></button>
    </div>
  </header>
  <div class="search-bar" id="search-bar"><input type="text" id="search-input" placeholder="搜尋中藥、藥方、穴道、筆記…" autocomplete="off"><div class="search-results" id="search-results"></div></div>
  <div class="sub-header" id="sub-header">
    <div class="pill-row" id="level-pills"></div>
    <div class="pill-row" id="category-pills"></div>
  </div>
  <div class="content-area" id="content-area">
    <div class="view" id="view-home"></div>
    <div class="view" id="view-list"></div>
    <div class="view" id="view-meridian"></div>
    <div class="view" id="view-detail"></div>
    <div class="view" id="view-form"></div>
    <div class="view" id="view-quiz-setup"></div>
    <div class="view" id="view-quiz-play"></div>
    <div class="view" id="view-quiz-results"></div>
    <div class="view" id="view-settings"></div>
  </div>
  <button class="fab" id="fab" style="display:none"><i class="fa-solid fa-plus"></i></button>
  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-btn active" data-tab="home"><i class="fa-solid fa-house"></i><span>首頁</span></button>
    <button class="nav-btn" data-tab="herbs"><i class="fa-solid fa-leaf"></i><span>中藥</span></button>
    <button class="nav-btn" data-tab="formulas"><i class="fa-solid fa-mortar-pestle"></i><span>藥方</span></button>
    <button class="nav-btn" data-tab="acupoints"><i class="fa-solid fa-crosshairs"></i><span>穴道</span></button>
    <button class="nav-btn" data-tab="theories"><i class="fa-solid fa-book-open"></i><span>筆記</span></button>
    <button class="nav-btn" data-tab="quiz"><i class="fa-solid fa-brain"></i><span>測驗</span><span class="badge" id="due-badge" style="display:none">0</span></button>
  </nav>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lb-close"><i class="fa-solid fa-xmark"></i></button>
  <button class="lightbox-nav lightbox-prev" id="lb-prev"><i class="fa-solid fa-chevron-left"></i></button>
  <img id="lightbox-img" src="" alt="">
  <button class="lightbox-nav lightbox-next" id="lb-next"><i class="fa-solid fa-chevron-right"></i></button>
  <div class="lightbox-counter" id="lightbox-counter"></div>
</div>
<div class="toast-wrap" id="toast-wrap"></div>

<script>
(function() {
"use strict";

/* === SECTIONS === */
var SECTIONS = {
  herbs: {
    key:'herbs',collection:'herbs',name:'中藥',icon:'fa-leaf',
    nameField:'name',nameLabel:'藥名',
    fields:[
      {key:'name',label:'藥名',type:'text',required:true,placeholder:'如：黃芪'},
      {key:'pinyin',label:'拼音',type:'text',placeholder:'如：Huáng Qí'},
      {key:'nature',label:'性',type:'select-one',options:['大寒','寒','微寒','涼','微涼','平','微溫','溫','熱','大熱']},
      {key:'taste',label:'味',type:'select-multi',options:['辛','甘','酸','苦','鹹','淡','澀']},
      {key:'meridians',label:'歸經',type:'select-multi',options:['肺','大腸','胃','脾','心','小腸','膀胱','腎','心包','三焦','膽','肝']},
      {key:'functions',label:'功效',type:'multi-input',placeholder:'輸入後按 Enter 新增…'},
      {key:'contraindications',label:'禁忌',type:'multi-input',placeholder:'輸入後按 Enter 新增…'},
      {key:'relatedFormulas',label:'所屬藥方',type:'formula-tags',placeholder:'搜尋藥方…'},
      {key:'notes',label:'備註',type:'textarea',placeholder:''}

function compressImage(file,maxW,quality){
  maxW=maxW||800;quality=quality||0.7;
  return new Promise(function(res,rej){
    var img=new Image();img.onload=function(){
      var w=img.width,h=img.height;
      if(w>maxW){h=Math.round(h*(maxW/w));w=maxW;}
      var c=document.createElement('canvas');c.width=w;c.height=h;
      var ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);
      res(c.toDataURL('image/jpeg',quality));
    };img.onerror=function(){rej(new Error('圖片讀取失敗'));};
    img.src=URL.createObjectURL(file);
  });
}

function miToStr(v){if(Array.isArray(v))return v.join('\n');return v||'';}
function miToArr(v){if(Array.isArray(v))return v.slice();if(typeof v==='string'&&v)return v.split('\n').filter(Boolean);return[];}
var DOSE_UNITS=['克','兩','斤','個','顆','片','條','ml'];
function convertDose(amount,fromUnit,toUnit){
  var a=parseFloat(amount);if(isNaN(a))return amount;
  var grams={'克':1,'兩':37.5,'斤':600};
  if(grams[fromUnit]&&grams[toUnit])return+(a*grams[fromUnit]/grams[toUnit]).toFixed(2);
  return amount;
}
function getHerbFormulas(herbName){
  var names=new Set();
  (state.data.formulas||[]).forEach(function(f){
    if(f.composition&&f.composition.length){
      f.composition.forEach(function(c){if(c.name===herbName)names.add(f.name);});
    }
  });
  return Array.from(names);
}
function mergeFormulas(herb){
  var manual=herb.relatedFormulas||[];
  var auto=getHerbFormulas(herb.name||'');
  var set=new Set(manual);
  auto.forEach(function(n){set.add(n);});
  return Array.from(set);
}
function syncFormulaHerbs(formula){
  var fname=formula.name;if(!fname)return;
  var herbsInFormula={};
  (formula.composition||[]).forEach(function(c){if(c.name)herbsInFormula[c.name]=true;});
  state.data.herbs.forEach(function(herb){
    var rf=herb.relatedFormulas||[];
    var hasIt=rf.indexOf(fname)!==-1;
    var shouldHave=!!herbsInFormula[herb.name];
    if(shouldHave&&!hasIt){
      herb.relatedFormulas=rf.concat([fname]);
      saveItem('herbs',herb);
    }else if(!shouldHave&&hasIt){
      herb.relatedFormulas=rf.filter(function(n){return n!==fname;});
      saveItem('herbs',herb);
    }
  });
}

}

function resetCategories(s){if(!state.config.categories)state.config.categories={};delete state.config.categories[s];saveConfig();}
function getUsedCategories(s){var pool=getFilteredItems(s,true),cats=new Set();pool.forEach(function(i){if(i.category)cats.add(i.category);});return Array.from(cats);}
function itemMatchesQuery(sec,i,q){
  var sd=SECTIONS[sec];
  // Search all text fields
  var match=sd.fields.some(function(fd){
    if(fd.type==='herb-list'){
      // Search composition names, prep, amounts
      if(i.composition)return i.composition.some(function(c){
        return(c.name&&c.name.toLowerCase().indexOf(q)!==-1)||(c.prep&&c.prep.toLowerCase().indexOf(q)!==-1);
      });
      return false;
    }
    if(fd.type==='formula-tags'){
      var rf=mergeFormulas(i);
      return rf.some(function(f){return f.toLowerCase().indexOf(q)!==-1;});
    }
    var v=i[fd.key];
    if(fd.type==='multi-input'){
      var arr=miToArr(v);
      return arr.some(function(s){return s.toLowerCase().indexOf(q)!==-1;});
    }
    return v&&String(v).toLowerCase().indexOf(q)!==-1;
  });
  // Search category and level
  if(!match&&i.category)match=i.category.toLowerCase().indexOf(q)!==-1;
  if(!match&&i.level)match=i.level.toLowerCase().indexOf(q)!==-1;
  // Search tags for theories
  if(!match&&i.tags)match=i.tags.toLowerCase().indexOf(q)!==-1;
  return match;
}
function getFilteredItems(sec,ignoreCat){
  var f=state.filter[sec],items=state.data[sec]||[];
  if(f.level)items=items.filter(function(i){return i.level===f.level;});
  if(!ignoreCat&&f.category)items=items.filter(function(i){return i.category===f.category;});
  if(f.search){
    var raw=f.search.trim().toLowerCase();
    // Split into keywords for multi-word search
    var keywords=raw.split(/\s+/).filter(Boolean);
    if(keywords.length){
      items=items.filter(function(i){
        return keywords.every(function(q){return itemMatchesQuery(sec,i,q);});
      });
    }
  }
  return items;
}
function sm2(srs,q){var iv=(srs&&srs.interval)||0,rp=(srs&&srs.repetition)||0,ef=(srs&&srs.efactor)||2.5;if(q<3){rp=0;iv=1;}else{if(rp===0)iv=1;else if(rp===1)iv=6;else iv=Math.round(iv*ef);rp++;}ef=Math.max(1.3,ef+(0.1-(5-q)*(0.08+(5-q)*0.02)));return{interval:iv,repetition:rp,efactor:ef,nextReview:Date.now()+iv*86400000,lastReview:Date.now()};}

/* === GLOBAL SEARCH === */
function globalSearch(raw){
  if(!raw||!raw.trim())return[];
  var keywords=raw.trim().toLowerCase().split(/\s+/).filter(Boolean);
  var results=[];
  ALL_SECTIONS.forEach(function(sec){
    var sd=SECTIONS[sec];
    (state.data[sec]||[]).forEach(function(item){
      var nm=(item[sd.nameField]||'').toLowerCase();
      var cat=(item.category||'').toLowerCase();
      var allText=nm+' '+cat;
      // Collect extra searchable text
      sd.fields.forEach(function(fd){
        if(fd.key===sd.nameField)return;
        if(fd.type==='herb-list'){
          if(item.composition)item.composition.forEach(function(c){allText+=' '+(c.name||'');});
        } else if(fd.type==='formula-tags'){
          var rf=mergeFormulas(item);allText+=' '+rf.join(' ');
        } else if(fd.type==='multi-input'){
          allText+=' '+miToArr(item[fd.key]).join(' ');
        } else {
          var v=item[fd.key];if(v)allText+=' '+String(v);
        }
      });
      if(item.tags)allText+=' '+item.tags;
      if(item.level)allText+=' '+item.level;
      allText=allText.toLowerCase();
      var matched=keywords.every(function(kw){return allText.indexOf(kw)!==-1;});
      if(matched){
        // Score: name match > category match > field match
        var score=0;
        if(nm.indexOf(keywords[0])===0)score=100;
        else if(nm.indexOf(keywords[0])!==-1)score=80;
        else if(cat.indexOf(keywords[0])!==-1)score=50;
        else score=20;
        results.push({sec:sec,id:item.id,name:item[sd.nameField]||'(無標題)',cat:item.category||'',icon:sd.icon,secName:sd.name,score:score});
      }
    });
  });
  results.sort(function(a,b){return b.score-a.score;});
  return results.slice(0,30);
}
function highlightMatch(text,query){
  if(!query||!text)return esc(text||'');
  var lower=text.toLowerCase(),idx=lower.indexOf(query.toLowerCase());
  if(idx===-1)return esc(text);
  return esc(text.substring(0,idx))+'<em>'+esc(text.substring(idx,idx+query.length))+'</em>'+esc(text.substring(idx+query.length));
}

function parseAcuCode(raw){
  if(!raw)return null;
  var c=raw.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  var prefix=c.replace(/[0-9]/g,'');
  var num=parseInt(c.replace(/[^0-9]/g,''),10);
  if(MERID_ALIAS[prefix])prefix=MERID_ALIAS[prefix];
  if(!prefix||isNaN(num))return null;
  return{prefix:prefix,num:num,full:c};
}
function interpolateMeridPos(merid,num){
  var pts=merid[4];
  var ex=pts.map(function(p){var m=p[0].match(/\d+/);return{num:m?parseInt(m[0],10):0,x:p[2],y:p[3]};}).sort(function(a,b){return a.num-b.num;});
  if(!ex.length)return null;
  if(num<=ex[0].num)return{x:ex[0].x+(Math.random()*4-2),y:ex[0].y-6};
  if(num>=ex[ex.length-1].num)return{x:ex[ex.length-1].x+(Math.random()*4-2),y:ex[ex.length-1].y+6};
  for(var i=0;i<ex.length-1;i++){
    if(num>=ex[i].num&&num<=ex[i+1].num){
      var t=ex[i+1].num===ex[i].num?0.5:(num-ex[i].num)/(ex[i+1].num-ex[i].num);
      return{x:Math.round(ex[i].x+t*(ex[i+1].x-ex[i].x)),y:Math.round(ex[i].y+t*(ex[i+1].y-ex[i].y))};
    }
  }
  return null;
}

  MERID.forEach(function(m){m[4].forEach(function(p){predef[p[0]]=true;predef[p[1]]=true;total++;if(lu[p[0]]||lu[p[1]])found++;});});
  (state.data.acupoints||[]).forEach(function(a){
    var code=a.code?a.code.trim().toUpperCase().replace(/[^A-Z0-9]/g,''):'';
    var name=a.name?a.name.trim():'';
    if(!predef[code]&&!predef[name]){
      var pc=parseAcuCode(a.code);
      if((pc&&MERID_BY_ID[pc.prefix])||(a.category&&MERID_BY_CAT[a.category])){extra++;found++;}
    }
  });

  return{total:total,found:found,pct:total?Math.round(found/total*100):0};
}

    });

  });

}

function getMiSuggestions(key,query){
  var all={},current=state.formMultiInputs[key]||[];
  ['herbs','formulas'].forEach(function(sec){
    (state.data[sec]||[]).forEach(function(item){
      var arr=miToArr(item[key]);
      arr.forEach(function(v){var t=v.trim();if(t){all[t]=(all[t]||0)+1;}});
    });
  });
  current.forEach(function(v){delete all[v.trim()];});
  if(!query)return[];
  var q=query.toLowerCase();
  var results=[];
  Object.keys(all).forEach(function(k){if(k.toLowerCase().indexOf(q)!==-1)results.push({text:k,count:all[k]});});
  results.sort(function(a,b){return b.count-a.count;});
  return results.slice(0,8);
}

function checkDupe(sec,field,val,exId){
  var w=document.getElementById('dupe-warn');if(!w)return;
  if(!val||!val.trim()){w.style.display='none';return;}
  var v=val.trim().toLowerCase();
  var matches=[];
  // Check same section + other related sections
  var searchSecs=[sec];
  if(sec==='herbs'||sec==='formulas')searchSecs=['herbs','formulas'];
  if(sec==='acupoints')searchSecs=['acupoints'];
  searchSecs.forEach(function(ss){
    var nf=SECTIONS[ss].nameField;
    (state.data[ss]||[]).forEach(function(i){
      if(exId&&i.id===exId&&ss===sec)return;
      var iv=i[nf];if(!iv)return;
      var ivl=iv.trim().toLowerCase();
      var sim=0;
      if(ivl===v){sim=100;}
      else if(ivl.indexOf(v)!==-1||v.indexOf(ivl)!==-1){sim=80;}
      else{
        // character overlap score
        var common=0;
        for(var ci=0;ci<v.length;ci++){if(ivl.indexOf(v[ci])!==-1)common++;}
        sim=v.length?Math.round(common/Math.max(v.length,ivl.length)*100):0;
        if(sim<50)sim=0;
      }
      if(sim>0)matches.push({name:iv,section:ss,category:i.category||'',sim:sim});
    });
  });
  matches.sort(function(a,b){return b.sim-a.sim;});
  matches=matches.slice(0,5);
  if(matches.length){
    var secNames={herbs:'中藥',formulas:'藥方',acupoints:'穴道',theories:'筆記'};
    var html='<i class="fa-solid fa-triangle-exclamation"></i> 疑似重複：'+matches.map(function(m){
      var tag=m.sim===100?'完全相同':'相似';
      return'<span class="dupe-match" style="display:inline-flex;align-items:center;gap:3px;margin:1px 3px;padding:1px 7px;border-radius:8px;background:'+(m.sim===100?'var(--danger-light)':'var(--gold-light)')+';color:'+(m.sim===100?'var(--danger)':'var(--gold)')+';font-weight:700;font-size:0.76rem">'+esc(m.name)+'<span style="font-weight:400;opacity:0.7;font-size:0.68rem">'+esc(secNames[m.section]||'')+(m.category?' · '+esc(m.category):'')+'</span></span>';
    }).join('');
    w.style.display='';w.innerHTML=html;
  }else w.style.display='none';
}

function submitForm(){
  var sec=state.section,sd=SECTIONS[sec],isEdit=state.editing&&state.currentItem,item=isEdit?Object.assign({},state.currentItem):{};
  sd.fields.forEach(function(fd){
    if(fd.type==='herb-list'){item.composition=state.formComposition.map(function(c){var o={name:c.name,amount:c.amount||'',unit:c.unit||'',prep:c.prep||''};return o;});}
    else if(fd.type==='formula-tags'){item.relatedFormulas=state.formFormulaTags.slice();}
    else if(fd.type==='multi-input'){item[fd.key]=(state.formMultiInputs[fd.key]||[]).filter(function(s){return s.trim();});}
    else if(fd.type==='select-one'||fd.type==='select-multi'){item[fd.key]=getSelPillValue('f-'+fd.key);}
    else{var el=document.getElementById('f-'+fd.key);if(el)item[fd.key]=el.value.trim();}
  });
  item.level=(document.getElementById('f-level')||{}).value||'';item.category=(document.getElementById('f-category')||{}).value||'';
  var req=sd.fields.find(function(f){return f.required;});if(req&&!item[req.key]){showAlert('請填寫'+req.label);return;}
  // Block exact duplicate names
  var nf=sd.nameField,nv=(item[nf]||'').trim().toLowerCase();
  if(nv){
    var exactDupe=state.data[sec].find(function(i){
      if(isEdit&&i.id===item.id)return false;
      return(i[nf]||'').trim().toLowerCase()===nv;
    });
    if(exactDupe){
      showConfirm('已存在同名項目「'+exactDupe[nf]+'」（'+esc(exactDupe.category||'未分類')+'）。\n確定仍要儲存嗎？','仍然儲存').then(function(ok){if(ok)doSubmitForm(sec,sd,isEdit,item);});
      return;
    }
  }
  doSubmitForm(sec,sd,isEdit,item);
}
function doSubmitForm(sec,sd,isEdit,item){
  if(!item.id)item.id=uid();
  var ups=[];var pc=state.formImages.pending.slice();var chain=Promise.resolve();

  chain.then(function(){
    if(isEdit&&state.currentItem.images){var rm=state.currentItem.images.filter(function(u){return state.formImages.existing.indexOf(u)===-1;});var dc=Promise.resolve();rm.forEach(function(u){dc=dc.then(function(){return deleteImageFile(sec,item.id,u);});});return dc;}
  }).then(function(){
    item.images=state.formImages.existing.concat(ups);
    state.formImages.pending.forEach(function(p){if(p.previewUrl)URL.revokeObjectURL(p.previewUrl);});

  });

  var qf=state.quiz.fields;
  if(qf&&qf.length)bf=filterBackFields(bf,qf);
  var fields=bf.filter(function(f){return f.value&&f.value.length>0;});
  if(!fields.length)return null;
  var field=fields[Math.floor(Math.random()*fields.length)];
  var distractors=[];
  var others=allItems.filter(function(o){return o.id!==item.id;});
  shuffle(others);
  for(var i=0;i<others.length&&distractors.length<3;i++){
    var obf=sd.quizBack(others[i]);
    var of=obf.find(function(f){return f.label===field.label;});
    if(of&&of.value&&of.value!==field.value&&distractors.indexOf(of.value)===-1)distractors.push(of.value);
  }
  if(distractors.length<2)return null;
  var options=shuffle(distractors.concat([field.value]));
  return{question:sd.quizFront(item),hint:sd.quizHint(item),fieldLabel:field.label,answer:field.value,options:options};
}
function genFillData(sec,item){
  var sd=SECTIONS[sec],bf=sd.quizBack(item);
  var qf=state.quiz.fields;
  if(qf&&qf.length)bf=filterBackFields(bf,qf);
  var fields=bf.filter(function(f){return f.value&&f.value.length>0&&f.value.length<40;});
  if(!fields.length)return null;
  var field=fields[Math.floor(Math.random()*fields.length)];
  return{clueLabel:field.label,clueValue:field.value,hint:sd.quizHint(item),answer:sd.quizFront(item)};
}
function getSelectedQuizFields(){
  var chosen=[];document.querySelectorAll('#q-fields .sel-pill.chosen').forEach(function(p){chosen.push(p.dataset.val);});

function filterBackFields(bf,fields){

  return bf.filter(function(f){return fields.indexOf(f.label)!==-1;});
}

    case 'rm-pending':var pi=parseInt(tgt.dataset.idx,10);var p=state.formImages.pending[pi];if(p&&p.previewUrl)URL.revokeObjectURL(p.previewUrl);state.formImages.pending.splice(pi,1);renderImagePreviews();break;
    case 'lightbox':if(state.currentItem&&state.currentItem.images)openLightbox(state.currentItem.images,parseInt(tgt.dataset.idx,10));break;
    case 'start-quiz':startQuiz();break;
    case 'flip-card':flipQC();break;
    case 'rate':rateQuiz(parseInt(tgt.dataset.q,10));break;
    case 'quit-quiz':if(state.quiz.results.length)finishQuiz();else switchTab('quiz');break;
    case 'mcq-answer':answerMCQ(tgt.dataset.val);break;
    case 'mcq-next':nextQuizAfterAnswer();break;
    case 'fill-submit':submitFill();break;
    case 'quiz-again':switchTab('quiz');break;
    case 'quiz-home':switchTab('home');break;
    case 'settings-back':switchTab(state.tab==='settings'?'home':(state.tab||'home'));break;
    case 'sign-out':signOut();break;
    case 'reset-fb':resetFB();break;
    case 'add-level':addLevel(tgt.dataset.sec);break;
    case 'rename-level':renameLevel(tgt.dataset.sec,tgt.dataset.lv);break;
    case 'del-level':deleteLevel(tgt.dataset.sec,tgt.dataset.lv);break;
    case 'mv-level':moveLvl(tgt.dataset.sec,parseInt(tgt.dataset.idx,10),parseInt(tgt.dataset.dir,10));break;
    case 'add-cat':addCategory(tgt.dataset.sec);break;
    case 'rename-cat':renameCategory(tgt.dataset.sec,tgt.dataset.cat);break;
    case 'del-cat':deleteCategory(tgt.dataset.sec,tgt.dataset.cat);break;
    case 'mv-cat':moveCat(tgt.dataset.sec,parseInt(tgt.dataset.idx,10),parseInt(tgt.dataset.dir,10));break;
    case 'reset-cats':resetCatsToDefault(tgt.dataset.sec);break;
    case 'export':exportData();break;
    case 'import':importData();break;
    case 'clear-all':clearAll();break;
    case 'rm-herb':state.formComposition.splice(parseInt(tgt.dataset.idx,10),1);refreshHerbList();break;
    case 'add-herb':state.formComposition.push({name:tgt.dataset.name,amount:'',unit:'',prep:''});refreshHerbList();break;
    case 'quick-new-herb':var dd0=document.getElementById('herb-dropdown');if(dd0)dd0.classList.remove('show');quickAddHerb(tgt.dataset.prefill).then(function(nm){if(nm){state.formComposition.push({name:nm,amount:'',unit:'',prep:''});refreshHerbList();toast('已新增「'+nm+'」到中藥庫');}});break;
    case 'rm-mi':state.formMultiInputs[tgt.dataset.miKey].splice(parseInt(tgt.dataset.miIdx,10),1);refreshMultiInput(tgt.dataset.miKey);break;
    case 'add-mi':var mk=tgt.dataset.miKey,mi=document.getElementById('mi-new-'+mk);if(mi&&mi.value.trim()){state.formMultiInputs[mk]=state.formMultiInputs[mk]||[];state.formMultiInputs[mk].push(mi.value.trim());refreshMultiInput(mk);var ni2=document.getElementById('mi-new-'+mk);if(ni2)ni2.focus();}break;
    case 'pick-mi-ac':var pk=tgt.dataset.miKey,pv=tgt.dataset.val;if(pk&&pv){state.formMultiInputs[pk]=state.formMultiInputs[pk]||[];state.formMultiInputs[pk].push(pv);refreshMultiInput(pk);var ni3=document.getElementById('mi-new-'+pk);if(ni3)ni3.focus();}break;
    case 'rm-ftag':state.formFormulaTags.splice(parseInt(tgt.dataset.idx,10),1);refreshFormulaTags();break;
    case 'add-ftag':if(tgt.dataset.name&&state.formFormulaTags.indexOf(tgt.dataset.name)===-1){state.formFormulaTags.push(tgt.dataset.name);refreshFormulaTags();}break;
    case 'goto-formula':var fn=tgt.dataset.fname;if(fn){var fm=state.data.formulas.find(function(f){return f.name===fn;});if(fm)openDetail('formulas',fm.id);else toast('找不到藥方「'+fn+'」');}break;
    case 'show-meridian':showMeridianMap();break;
    case 'back-meridian':backToList();break;
    case 'sr-go':var srSec=tgt.closest('.sr-item').dataset.sec,srId=tgt.closest('.sr-item').dataset.id;if(srSec&&srId){closeSearch();openDetail(srSec,srId);}break;
  }
});

document.getElementById('category-pills').addEventListener('click',function(e){var p=e.target.closest('.pill');if(p)filterCategory(p.dataset.cat||null);});
document.getElementById('bottom-nav').addEventListener('click',function(e){var b=e.target.closest('.nav-btn');if(b&&b.dataset.tab)switchTab(b.dataset.tab);});
document.getElementById('logo-home').addEventListener('click',function(){switchTab('home');});
document.getElementById('btn-search').addEventListener('click',toggleSearch);
document.getElementById('btn-settings').addEventListener('click',showSettings);
document.getElementById('search-input').addEventListener('input',function(){onSearchD(this.value);});

document.addEventListener('click',function(e){var sr=document.getElementById('search-results');if(sr.classList.contains('open')&&!e.target.closest('.search-bar')){closeSearchResults();}});

document.getElementById('lb-close').addEventListener('click',closeLightbox);

document.getElementById('lb-next').addEventListener('click',function(){lbNav(1);});

(function(){var sx=0,lb=document.getElementById('lightbox');lb.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;},{passive:true});lb.addEventListener('touchend',function(e){var d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)lbNav(d<0?1:-1);},{passive:true});})();

/* === SWIPE BACK === */
(function(){
  var ca=document.getElementById('content-area'),sx=0,sy=0;
  ca.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  ca.addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(dx>80&&Math.abs(dy)<80){
      if(state.view==='detail'){backToList();}
      else if(state.view==='form'){/* disabled: only cancel/save buttons */}
      else if(state.view==='meridian'){backToList();}
      else if(state.view==='settings'){switchTab(state.tab==='settings'?'home':(state.tab||'home'));}
    }
  },{passive:true});
})();
